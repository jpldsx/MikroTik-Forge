name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by the deploy workflow
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests + RouterOS script linter
        run: node --test tests/*.test.js
      - name: Golden snapshots are up to date
        run: |
          node scripts/build-examples.js
          git diff --exit-code configs/ || { echo "::error::configs/ snapshots changed - run 'npm run examples' and commit the diff"; exit 1; }
